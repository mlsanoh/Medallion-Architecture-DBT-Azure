name: Validation JSON ADF
on:
  push:
    branches: [master]
  pull_request:
    branches: [master]
permissions:
  contents: read
jobs:
  validate_adf:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Vérifier la syntaxe des fichiers JSON ADF
        run: |
          for file in adf-contoso-analytics-pipeline/*/*.json adf-contoso-analytics-pipeline/publish_config.json; do
            python -m json.tool "$file" > /dev/null
          done
